name: OrangeFinance
options:
  bundleIdPrefix: com.ennearock
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  OrangeFinance:
    type: application
    platform: iOS
    sources:
      - path: OrangeFinance
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ennearock.orangefinance
        INFOPLIST_FILE: OrangeFinance/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
  OrangeFinanceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [OrangeFinanceTests]
    dependencies:
      - target: OrangeFinance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ennearock.orangefinance.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OrangeFinance:
    build:
      targets:
        OrangeFinance: all
    test:
      targets: [OrangeFinanceTests]
  OrangeFinanceTests:
    build:
      targets:
        OrangeFinance: all
        OrangeFinanceTests: [test]
    test:
      targets: [OrangeFinanceTests]

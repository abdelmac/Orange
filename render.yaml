services:
  - type: web
    name: orange-finance
    runtime: node
    repo: https://github.com/abdelmac/Orange
    region: frankfurt
    plan: 0.5c-512mb
    branch: main
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run build && node scripts/prepare-render.mjs
    preDeployCommand: npm run db:migrate
    startCommand: node scripts/start-render.mjs
    healthCheckPath: /api/health
    disk:
      name: orange-private-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24.14.1"
      - key: NODE_ENV
        value: production
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: DATABASE_URL
        fromDatabase:
          name: orange-finance-db
          property: connectionString

databases:
  - name: orange-finance-db
    region: frankfurt
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    diskSizeGB: 1
    ipAllowList: []

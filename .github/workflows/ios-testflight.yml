name: iOS — signed release and TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version commerciale (ex. 1.0.0)"
        required: true
        default: "1.0.0"
        type: string
      build_number:
        description: "Nouveau numéro de build Apple (ex. 1 ou 1.0.1)"
        required: true
        type: string
      upload_to_testflight:
        description: "Envoyer le build à App Store Connect pour TestFlight"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-distribution
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    environment: ios-release
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      APP_VERSION: ${{ inputs.version }}
      APP_BUILD_NUMBER: ${{ inputs.build_number }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate release inputs and Xcode
        run: |
          python3 scripts/ios/ci-signing.py inputs
          xcodebuild -version
          test "$(xcodebuild -version | head -1 | cut -d' ' -f2 | cut -d. -f1)" -ge 26
          command -v xcodegen >/dev/null || brew install xcodegen
      - name: Generate project
        working-directory: mobile/ios
        run: xcodegen generate
      - name: Run unit tests before distribution signing
        timeout-minutes: 12
        working-directory: mobile/ios
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); r=sorted((r for r in d["devices"] if ".iOS-" in r), key=lambda r: tuple(map(int,r.split(".iOS-")[-1].split("-"))), reverse=True); print(next(x["udid"] for runtime in r for x in d["devices"][runtime] if "iPhone" in x["name"]))')
          xcodebuild -project OrangeFinance.xcodeproj -scheme OrangeFinanceTests \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath DerivedData -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 30 \
            -maximum-test-execution-time-allowance 60 \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= test
      # Certificate/profile are supplied by the owner. No automatic provisioning or revocation.
      # https://docs.github.com/en/actions/how-tos/deploy/deploy-to-third-party-platforms/sign-xcode-applications
      - name: Install and validate the distribution identity
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          umask 077
          python3 scripts/ios/ci-signing.py prepare
          SIGNING_DIR="$RUNNER_TEMP/orange-ios-signing"
          KEYCHAIN="$SIGNING_DIR/release.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$SIGNING_DIR/distribution.p12" -P "$IOS_DISTRIBUTION_P12_PASSWORD" \
            -t cert -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          python3 scripts/ios/ci-signing.py profile
      - name: Install validated provisioning profile
        run: |
          for PROFILE_DIR in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$PROFILE_DIR"
            cp "$RUNNER_TEMP/orange-ios-signing/profile.mobileprovision" "$PROFILE_DIR/$IOS_PROFILE_UUID.mobileprovision"
          done
      - name: Archive signed device application
        working-directory: mobile/ios
        run: |
          xcodebuild -project OrangeFinance.xcodeproj -scheme OrangeFinance \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/OrangeFinance.xcarchive" \
            -derivedDataPath DerivedData \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$APP_BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="$IOS_SIGNING_SHA1" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_UUID" archive
      - name: Export and verify signed application
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/OrangeFinance.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/orange-ios-signing/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/orange-ios-export"
          test -f "$RUNNER_TEMP/orange-ios-export/OrangeFinance.ipa"
          ditto -x -k "$RUNNER_TEMP/orange-ios-export/OrangeFinance.ipa" "$RUNNER_TEMP/orange-ios-verify"
          export SIGNED_APP_PATH="$RUNNER_TEMP/orange-ios-verify/Payload/OrangeFinance.app"
          codesign --verify --deep --strict "$SIGNED_APP_PATH"
          python3 scripts/ios/ci-signing.py verify-app
      - name: Retain only the signed IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: OrangeFinance-signed-${{ inputs.version }}-${{ inputs.build_number }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/orange-ios-export/OrangeFinance.ipa
      # Upload creates a build for testing, not an App Review submission or public release.
      # https://developer.apple.com/help/app-store-connect/manage-builds/upload-builds/
      - name: Validate and upload to App Store Connect
        if: inputs.upload_to_testflight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          umask 077
          python3 scripts/ios/ci-signing.py upload-key
          cd "$RUNNER_TEMP/orange-ios-signing"
          xcrun altool --validate-app -f "$RUNNER_TEMP/orange-ios-export/OrangeFinance.ipa" \
            -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app -f "$RUNNER_TEMP/orange-ios-export/OrangeFinance.ipa" \
            -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Remove temporary signing material
        if: always()
        run: |
          SIGNING_DIR="$RUNNER_TEMP/orange-ios-signing"
          if [ -f "$SIGNING_DIR/release.keychain-db" ]; then
            security delete-keychain "$SIGNING_DIR/release.keychain-db" || true
          fi
          if [[ "${IOS_PROFILE_UUID:-}" =~ ^[0-9A-Fa-f-]{36}$ ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"
          fi
          rm -rf "$SIGNING_DIR" "$RUNNER_TEMP/orange-ios-verify" "$RUNNER_TEMP/OrangeFinance.xcarchive"
